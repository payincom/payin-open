<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#4F46E5" opacity="0.1"/>

  <!-- Main icon - payment symbol -->
  <g transform="translate(100, 100)">
    <!-- Dollar sign base -->
    <path d="M -10 -50 L -10 50" stroke="#4F46E5" stroke-width="8" stroke-linecap="round"/>
    <path d="M 10 -50 L 10 50" stroke="#4F46E5" stroke-width="8" stroke-linecap="round"/>

    <!-- S shape -->
    <path d="M -35 -30 Q -35 -45 -20 -45 L 20 -45 Q 35 -45 35 -30 Q 35 -15 20 -15 L -20 -15 Q -35 -15 -35 0 Q -35 15 -20 15 L 20 15 Q 35 15 35 30 Q 35 45 20 45 L -20 45 Q -35 45 -35 30"
          fill="none" stroke="#4F46E5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Blockchain connection dots -->
  <circle cx="30" cy="100" r="6" fill="#10B981"/>
  <circle cx="170" cy="100" r="6" fill="#10B981"/>
  <circle cx="100" cy="30" r="6" fill="#10B981"/>
  <circle cx="100" cy="170" r="6" fill="#10B981"/>

  <!-- Connection lines -->
  <line x1="36" y1="100" x2="64" y2="100" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="136" y1="100" x2="164" y2="100" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="100" y1="36" x2="100" y2="64" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="100" y1="136" x2="100" y2="164" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
