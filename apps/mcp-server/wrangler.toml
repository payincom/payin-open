# Cloudflare Workers Configuration
name = "payin-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Worker configuration
workers_dev = true

# Environment variables (non-sensitive)
# For sensitive variables like API keys, use .dev.vars locally or wrangler secret in production
[vars]
# Network-specific API URLs
PAYIN_TESTNET_API_URL = "https://app.testnet.payin.com"
PAYIN_MAINNET_API_URL = "https://app.mainnet.payin.com"

# Legacy fallback (for backward compatibility)
DEFAULT_PAYIN_API_URL = "https://app.testnet.payin.com"

# Server configuration
LOG_LEVEL = "info"

# Optional overrides (uncomment to use)
# PAYIN_API_URL = ""           # Explicit override (ignores network type)
# REQUIRE_API_KEY_HEADER = ""  # Set to "true" to enforce API key from header only

# Set PAYIN_API_KEY using: wrangler secret put PAYIN_API_KEY

# Build configuration
# Note: wrangler compiles TypeScript automatically
# Documentation is pre-generated by npm run dev/deploy

# Limits
[limits]
cpu_ms = 50000
