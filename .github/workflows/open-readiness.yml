name: PayIn Open Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Boundary check
        run: npm run boundary:check
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Docs build
        run: npm run build -w apps/docs
