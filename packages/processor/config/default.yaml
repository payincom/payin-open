# Processor Default Configuration
# This file contains the default settings for all environments
# Values can be overridden by environment-specific files or environment variables

# Database Configuration
database:
  # Connection string (highest priority)
  # If not set, will use individual connection parameters below
  # connectionString: postgresql://user:password@host:port/database

  # Individual connection parameters (used if connectionString is not set)
  host: localhost
  port: 5432
  database: payin
  username: postgres
  password: ""
  maxConnections: 10
  ssl: false

# Monitor Configuration
monitor:
  # Chains to monitor (optional)
  # If not specified, Monitor will track all chains defined in the 'chains' section below
  # If specified, must be a subset of chains defined in 'chains' section
  # Example: To monitor only specific chains, uncomment and modify:
  # chains:
  #   - ethereum-sepolia
  #   - polygon-amoy

  # Initial monitoring targets (optional)
  # Targets will be dynamically added when orders are created or addresses are bound
  targets: []

  # RPC API Keys
  # These will be passed to RPCConfigBuilder
  rpcKeys:
    trongrid: "${RPC_TRONGRID_KEY}"
    alchemy: "${ALCHEMY_API_KEY}"
    infura: "${INFURA_API_KEY}"

# Skip monitor recovery on startup
# Set to true to skip recovery of missed blocks
skipMonitorRecovery: false

# Service Configuration
services:
  orders: true      # Enable order payment service
  deposits: true    # Enable user deposit service

# Order Service Configuration
orders:
  defaultPaymentWindowMinutes: 10    # Default payment window
  defaultGracePeriodMinutes: 5       # Grace period after payment window
  maxTotalTimeoutMinutes: 60         # Maximum total timeout
  maintenanceIntervalMs: 60000       # Maintenance interval (1 minute)

# Delayed Confirmation Configuration
delayedConfirmation:
  enabled: true
  checkInterval: 30000              # Check interval in milliseconds (30 seconds)
  maxPendingTime: 600000            # Max pending time (10 minutes)
  maxPendingTransactions: 1000      # Max pending transactions
  maxRetries: 3                     # Max retry attempts

# Deposit Service Configuration
deposits:
  poolManagement:
    defaultCooldownMinutes: 30      # Address cooldown period
    maxPoolSize: 10000              # Maximum pool size
    lowPoolThreshold: 100           # Low pool threshold for alerts

  importValidation:
    validateDerivationPath: true    # Validate derivation path on import
    maxImportBatchSize: 1000        # Maximum import batch size

# Chain Configurations
# Define supported blockchain chains and their protocol families
# This is the primary chain configuration - all chains your system supports should be listed here
# Monitor will automatically track all these chains unless you specify a subset in monitor.chains
chains:
  ethereum-mainnet:
    protocol: evm
    name: Ethereum Mainnet
    network: mainnet
    confirmations: 12         # Required block confirmations
    metadata:
      explorer_url: https://etherscan.io
  ethereum-sepolia:
    protocol: evm
    name: Ethereum Sepolia Testnet
    network: testnet
    confirmations: 3          # Required block confirmations
    metadata:
      explorer_url: https://sepolia.etherscan.io
  polygon-mainnet:
    protocol: evm
    name: Polygon Mainnet
    network: mainnet
    confirmations: 128        # Required block confirmations
    metadata:
      explorer_url: https://polygonscan.com
  polygon-amoy:
    protocol: evm
    name: Polygon Amoy Testnet
    network: testnet
    confirmations: 10         # Required block confirmations
    metadata:
      explorer_url: https://amoy.polygonscan.com
  tron-mainnet:
    protocol: tron
    name: Tron Mainnet
    network: mainnet
    confirmations: 19         # Required block confirmations
    metadata:
      explorer_url: https://tronscan.org
  tron-nile:
    protocol: tron
    name: Tron Nile Testnet
    network: testnet
    confirmations: 3          # Required block confirmations
    metadata:
      explorer_url: https://nile.tronscan.org
  solana-mainnet:
    protocol: solana
    name: Solana Mainnet
    network: mainnet
    confirmations: 1          # Required block confirmations (Solana has fast finality)
    metadata:
      explorer_url: https://explorer.solana.com
  solana-devnet:
    protocol: solana
    name: Solana Devnet
    network: testnet
    confirmations: 1          # Required block confirmations (Solana has fast finality)
    metadata:
      explorer_url: https://explorer.solana.com
  arbitrum-mainnet:
    protocol: evm
    name: Arbitrum One
    network: mainnet
    confirmations: 64
    metadata:
      explorer_url: https://arbiscan.io
  arbitrum-sepolia:
    protocol: evm
    name: Arbitrum Sepolia Testnet
    network: testnet
    confirmations: 3
    metadata:
      explorer_url: https://sepolia.arbiscan.io

