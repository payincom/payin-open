# RPC Configuration (optional)
# Override Monitor's RPC settings for chain-specific configurations
# If not specified, Monitor will use its default RPC provider settings
rpc:
  # Chain-specific RPC configurations
  # These settings override Monitor's default.yaml for each chain
  chains:
    ethereum-mainnet:
      preferredProviders: [alchemy, infura, publicnode]
      timeout: 5000
    ethereum-sepolia:
      # Testnet/Open demo defaults prioritize public RPC for out-of-the-box operation.
      # Operators can override preferredProviders to put Alchemy/Infura/etc. first.
      preferredProviders: [publicnode, alchemy, infura]
      timeout: 5000
    polygon-mainnet:
      preferredProviders: [alchemy, ankr, publicnode]
      timeout: 6000
    polygon-amoy:
      preferredProviders: [publicnode, alchemy, ankr]
      timeout: 6000
    tron-mainnet:
      preferredProviders: [trongrid]
      timeout: 8000
    tron-nile:
      preferredProviders: [trongrid]
      timeout: 8000
    solana-mainnet:
      preferredProviders: [publicnode]
      timeout: 5000
    solana-devnet:
      preferredProviders: [publicnode]
      timeout: 5000
    arbitrum-mainnet:
      preferredProviders: [alchemy, publicnode]
      timeout: 6000
    arbitrum-sepolia:
      preferredProviders: [publicnode, alchemy]
      timeout: 6000

  # Custom RPC providers (optional)
  # Add your own RPC provider templates here
  # These will be merged with Monitor's built-in providers
  # providers:
  #   quicknode:
  #     displayName: "QuickNode"
  #     authType: url_path
  #     urlPattern: "https://{network}.quiknode.pro/{apiKey}"
  #     supportedNetworks: [ethereum-mainnet, polygon-mainnet]
  #     networkMappings:
  #       ethereum-mainnet: ethereum-mainnet
  #     defaultSettings:
  #       timeout: 5000
  #       weight: 95
  #       maxRequestsPerSecond: 15
