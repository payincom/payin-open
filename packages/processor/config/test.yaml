      polygon-amoy: "0x41E94Eb019C0762f9Bfcf9Fb1E58725BfB0e7582"
      solana-devnet: "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"  # Official Devnet USDC
  USDT:
    symbol: USDT
    name: Tether USD
