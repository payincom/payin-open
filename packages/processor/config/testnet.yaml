# Processor Testnet Configuration
# This file overrides default.yaml for testnet environments
# Only includes testnet chains and their tokens (Sepolia, Amoy, Nile, Devnet, etc.)

# Chain Configurations - Only Testnets
chains:
  ethereum-sepolia:
    protocol: evm
    name: Ethereum Sepolia Testnet
    network: testnet
    confirmations: 3
    metadata:
      explorer_url: https://sepolia.etherscan.io
  polygon-amoy:
    protocol: evm
    name: Polygon Amoy Testnet
    network: testnet
    confirmations: 10
    metadata:
      explorer_url: https://amoy.polygonscan.com
  tron-nile:
    protocol: tron
    name: Tron Nile Testnet
    network: testnet
    confirmations: 3
    metadata:
      explorer_url: https://nile.tronscan.org
  solana-devnet:
    protocol: solana
    name: Solana Devnet
    network: testnet
    confirmations: 1
    metadata:
      explorer_url: https://explorer.solana.com
  arbitrum-sepolia:
    protocol: evm
    name: Arbitrum Sepolia Testnet
    network: testnet
    confirmations: 3
    metadata:
      explorer_url: https://sepolia.arbiscan.io
  xlayer-testnet:
    protocol: evm
    name: X Layer Testnet
    network: testnet
    confirmations: 3
    metadata:
      explorer_url: https://www.oklink.com/xlayer-test

