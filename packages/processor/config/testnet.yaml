# RPC Configuration - Only Testnet Chains
rpc:
  chains:
    ethereum-sepolia:
      preferredProviders: [alchemy, infura, publicnode]
      timeout: 5000
    polygon-amoy:
      preferredProviders: [alchemy, ankr, publicnode]
      timeout: 6000
    tron-nile:
      preferredProviders: [trongrid]
      timeout: 8000
    solana-devnet:
      preferredProviders: [publicnode]
      timeout: 5000
    arbitrum-sepolia:
      preferredProviders: [alchemy, publicnode]
      timeout: 6000
    xlayer-testnet:
      preferredProviders: [xlayer-public, xlayer-okx]
      timeout: 6000
