# Processor Mainnet Configuration
# This file overrides default.yaml for production mainnet environments
# Only includes mainnet chains and their tokens (Ethereum, Polygon, Tron, Solana, etc.)

skipMonitorRecovery: true

# Chain Configurations - Only Mainnets
chains:
  ethereum-mainnet:
    protocol: evm
    name: Ethereum Mainnet
    network: mainnet
    confirmations: 12
    metadata:
      explorer_url: https://etherscan.io
  polygon-mainnet:
    protocol: evm
    name: Polygon Mainnet
    network: mainnet
    confirmations: 128
    metadata:
      explorer_url: https://polygonscan.com
  tron-mainnet:
    protocol: tron
    name: Tron Mainnet
    network: mainnet
    confirmations: 19
    metadata:
      explorer_url: https://tronscan.org
  solana-mainnet:
    protocol: solana
    name: Solana Mainnet
    network: mainnet
    confirmations: 32
    metadata:
      explorer_url: https://explorer.solana.com
  arbitrum-mainnet:
    protocol: evm
    name: Arbitrum One
    network: mainnet
    confirmations: 64
    metadata:
      explorer_url: https://arbiscan.io
  xlayer-mainnet:
    protocol: evm
    name: X Layer Mainnet
    network: mainnet
    confirmations: 10
    metadata:
      explorer_url: https://www.oklink.com/xlayer

