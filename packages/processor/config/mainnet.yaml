# RPC Configuration - Only Mainnet Chains
rpc:
  chains:
    ethereum-mainnet:
      preferredProviders: [publicnode, alchemy, infura]
      timeout: 10000
    polygon-mainnet:
      preferredProviders: [publicnode, ankr, alchemy]
      timeout: 10000
    tron-mainnet:
      preferredProviders: [trongrid]
      timeout: 12000
    solana-mainnet:
      preferredProviders: [solana-public, helius]
      excludeProviders: [tatum]
      weight: 100
      timeout: 10000
    arbitrum-mainnet:
      preferredProviders: [alchemy, publicnode]
      timeout: 10000
    xlayer-mainnet:
      preferredProviders: [xlayer-okx, xlayer-public]
      timeout: 10000
