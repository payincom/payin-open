services:
  postgres:
    image: postgres:15-alpine
    container_name: payin-open-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payin_open}
      POSTGRES_USER: ${POSTGRES_USER:-payin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payin_local_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payin-open-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PAYIN_RUNTIME: open
      HOST: 0.0.0.0
      PORT: 3000
      DB_CONNECTION_STRING: postgresql://${POSTGRES_USER:-payin}:${POSTGRES_PASSWORD:-payin_local_password}@postgres:5432/${POSTGRES_DB:-payin_open}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting PayIn Open}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET before starting PayIn Open}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  postgres-test:
    image: postgres:15-alpine
    container_name: payin-open-postgres-test
    profiles:
      - test
    environment:
      POSTGRES_DB: payin_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payin_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_test_data:
