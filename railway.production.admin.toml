# ============================================================
# Railway Deployment Configuration for PayIn Admin (Production Environment)
# ============================================================
# Documentation: https://docs.railway.app/deploy/config-as-code
#
# Environment: Production
# Railway Project: https://railway.com/project/<RAILWAY_PROJECT_ID>?environmentId=<RAILWAY_PRODUCTION_ENVIRONMENT_ID>
# Admin Domain: app.payin.com
# API Domain: api.payin.com
#
# Deployment: Git push triggers automatic build and deploy on Railway
# ============================================================

[build]
# Use Dockerfile for Admin frontend (nginx static server)
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.admin"

# Watch paths - only trigger builds when these paths change
watchPaths = [
  "apps/admin/**",
  "Dockerfile.admin",
  "railway.production.admin.toml"
]

# Build arguments (environment variables for Vite build)
# These are injected at build time and baked into the static files
[build.buildArgs]
VITE_API_URL = "https://api.payin.com/api/v1"
# VITE_PAYMENT_LINK_PUBLIC_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# should be set in Railway Dashboard

[deploy]
# Nginx runs on port 80, Railway will map to public URL
# No start command needed - nginx starts automatically via Dockerfile CMD

# Health check configuration
healthcheckPath = "/"
healthcheckTimeout = 60    # 1 minute for initial startup

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
